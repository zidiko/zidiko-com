<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zidiko</title>
<meta name="description" content="Zidiko AB is a Swedish-based consultancy and product development company. Its organization number is 559147-4944, and it is owned by Markus Johansson, founder and former owner of Zoezi. For inquiries, ideas, or to get in touch, email contact@zidiko.com.">
<meta property="og:title" content="Zidiko">
<meta property="og:description" content="Zidiko AB is a Swedish-based consultancy and product development company. Its organization number is 559147-4944, and it is owned by Markus Johansson, founder and former owner of Zoezi. For inquiries, ideas, or to get in touch, email contact@zidiko.com.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://zidiko.com/">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@100;200;300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

  :root{
    --brand:#c8ddf5;
    --glow:rgba(200,221,245,.25);
    --bg:#0b1929;
    --ease-smooth:cubic-bezier(.16,1,.3,1);
  }

  body{
    min-height:100vh;
    background:radial-gradient(ellipse at 50% 40%, #152a44 0%, #0f2035 40%, var(--bg) 100%);
    font-family:'Sora',sans-serif;
    overflow:hidden;
    position:relative;
    color:var(--brand);
  }

  /* ── Logo — always centered ── */
  .logo{
    position:fixed;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    z-index:400;
    text-align:center;
  }
  .logo h1{
    font-size:clamp(3rem,11vw,10rem);
    font-weight:800;
    letter-spacing:-.03em;
    line-height:1;
    color:var(--brand);
    text-shadow:0 10px 28px rgba(0,0,0,.3);
    position:relative;
    display:inline-block;
  }

  /* shimmer sweep */
  .logo h1::after{
    content:'Zidiko';
    position:absolute;inset:0;
    background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.3) 45%,rgba(255,255,255,.45) 50%,rgba(255,255,255,.3) 55%,transparent 100%);
    background-size:30% 100%;
    background-position:-50% center;
    background-repeat:no-repeat;
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
    animation:shimmer 6s linear infinite;
    pointer-events:none;
  }
  @keyframes shimmer{
    0%{background-position:-50% center}
    40%{background-position:150% center}
    100%{background-position:150% center}
  }

  /* per-letter stagger on load */
  .logo h1 span{
    display:inline-block;
    animation:letterIn .8s var(--ease-smooth) both;
    transition:transform .35s var(--ease-smooth), text-shadow .35s ease;
    will-change:transform;
  }
  .logo h1 span:nth-child(1){animation-delay:.15s}
  .logo h1 span:nth-child(2){animation-delay:.22s}
  .logo h1 span:nth-child(3){animation-delay:.29s}
  .logo h1 span:nth-child(4){animation-delay:.36s}
  .logo h1 span:nth-child(5){animation-delay:.43s}
  .logo h1 span:nth-child(6){animation-delay:.50s}

  @keyframes letterIn{
    from{opacity:0;transform:translateY(30px) rotateX(40deg) scale(.7)}
    to{opacity:1;transform:translateY(0) rotateX(0) scale(1)}
  }

  .logo h1 span:hover{
    transform:translateY(-8px) scale(1.12);
    text-shadow:0 12px 40px var(--glow);
  }

  /* accent line */
  .logo .accent{
    display:block;
    margin:1.2rem auto 0;
    width:0;
    height:3px;
    border-radius:3px;
    background:linear-gradient(90deg,transparent,var(--brand),transparent);
    animation:lineGrow 1.4s .9s var(--ease-smooth) forwards;
    transform-origin:center;
  }
  @keyframes lineGrow{to{width:60%}}

  /* tagline */
  .logo .tagline{
    margin-top:1.6rem;
    font-size:clamp(.85rem,2vw,1.15rem);
    font-weight:300;
    opacity:0;
    letter-spacing:.12em;
    text-transform:uppercase;
    text-align:center;
    animation:fadeUp .9s 1.3s var(--ease-smooth) forwards;
  }

  /* email */
  .logo .email{
    margin-top:1.2rem;
    font-size:clamp(.75rem,1.6vw,.95rem);
    font-weight:300;
    opacity:0;
    letter-spacing:.06em;
    text-align:center;
    animation:fadeUp .9s 1.6s var(--ease-smooth) forwards;
  }
  .logo .email a{
    color:var(--brand);
    text-decoration:none;
    transition:opacity .3s ease;
    opacity:.7;
  }
  .logo .email a:hover{
    opacity:1;
  }

  @keyframes fadeUp{
    from{opacity:0;transform:translateY(10px)}
    to{opacity:1;transform:translateY(0)}
  }

  /* ── Star field ── */
  .starfield{
    position:fixed;inset:0;
    pointer-events:none;
    z-index:0;
  }

  /* ── Particles ── */
  .particles{position:fixed;inset:0;pointer-events:none;z-index:0}
  .particles span{
    position:absolute;
    width:4px;height:4px;
    background:var(--brand);
    border-radius:50%;
    opacity:0;
    animation:float linear infinite;
  }
  @keyframes float{
    0%{transform:translateY(100vh) scale(0);opacity:0}
    10%{opacity:.12}
    90%{opacity:.12}
    100%{transform:translateY(-10vh) scale(1);opacity:0}
  }

  /* ── Background rings ── */
  .bg-ring{
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    border:1px solid rgba(200,221,245,.08);
    pointer-events:none;
    animation:pulse 6s ease-in-out infinite;
  }
  .bg-ring:nth-child(1){width:600px;height:600px;animation-delay:0s}
  .bg-ring:nth-child(2){width:900px;height:900px;animation-delay:1.5s}

  @keyframes pulse{
    0%,100%{transform:translate(-50%,-50%) scale(.85);opacity:.4}
    50%{transform:translate(-50%,-50%) scale(1.1);opacity:1}
  }

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{
      animation-duration:.01ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.01ms !important;
      scroll-behavior:auto !important;
    }

    .particles,
    .starfield{
      display:none;
    }

    .bg-ring{
      opacity:.45;
      animation:none;
    }

    .logo h1::after{
      animation:none;
      background-position:150% center;
    }

    .logo h1 span,
    .logo .accent,
    .logo .tagline,
    .logo .email{
      animation:none;
      opacity:1;
      transform:none;
    }

    .logo h1 span:hover{
      transform:none;
      text-shadow:none;
    }

    .logo .accent{
      width:60%;
    }
  }
</style>
</head>
<body>

<!-- Logo -->
<div class="logo">
  <h1 aria-label="Zidiko">
    <span>Z</span><span>i</span><span>d</span><span>i</span><span>k</span><span>o</span>
  </h1>
  <span class="accent"></span>
  <p class="tagline">Crafting the future</p>
  <p class="email"><a href="mailto:contact@zidiko.com">contact@zidiko.com</a></p>
</div>

<!-- Star field -->
<canvas class="starfield" id="starfield"></canvas>

<!-- Particles -->
<div class="particles" id="particles"></div>

<!-- Background rings -->
<div class="bg-ring"></div>
<div class="bg-ring"></div>

<script>
  // Star field — fly-through effect
  (function() {
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    if (prefersReducedMotion.matches) return;

    const canvas = document.getElementById('starfield');
    const ctx = canvas.getContext('2d');
    let w, h;
    const STAR_COUNT = 200;
    const SPEED = 0.4;
    const MAX_DEPTH = 1000;
    const stars = [];

    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }

    function makeStar(randomZ) {
      return {
        x: (Math.random() - 0.5) * w * 2,
        y: (Math.random() - 0.5) * h * 2,
        z: randomZ ? Math.random() * MAX_DEPTH : MAX_DEPTH,
        twinkleOffset: Math.random() * Math.PI * 2
      };
    }

    function init() {
      resize();
      for (let i = 0; i < STAR_COUNT; i++) stars.push(makeStar(true));
    }

    function draw(t) {
      ctx.clearRect(0, 0, w, h);
      const cx = w / 2;
      const cy = h / 2;

      for (let i = 0; i < stars.length; i++) {
        const s = stars[i];
        s.z -= SPEED;

        if (s.z <= 0) {
          const ns = makeStar(false);
          s.x = ns.x; s.y = ns.y; s.z = ns.z; s.twinkleOffset = ns.twinkleOffset;
        }

        const k = 300 / s.z;
        const sx = cx + s.x * k;
        const sy = cy + s.y * k;

        if (sx < -10 || sx > w + 10 || sy < -10 || sy > h + 10) continue;

        const depth = 1 - s.z / MAX_DEPTH;
        const r = 0.3 + depth * 1.8;
        const alpha = 0.15 + depth * 0.7;

        if (r > 1.2) {
          const gr = r * 3;
          const grad = ctx.createRadialGradient(sx, sy, 0, sx, sy, gr);
          grad.addColorStop(0, `rgba(255,255,255,${alpha * 0.4})`);
          grad.addColorStop(1, 'rgba(255,255,255,0)');
          ctx.beginPath();
          ctx.arc(sx, sy, gr, 0, Math.PI * 2);
          ctx.fillStyle = grad;
          ctx.fill();
        }

        ctx.beginPath();
        ctx.arc(sx, sy, r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${alpha})`;
        ctx.fill();
      }
      requestAnimationFrame(draw);
    }

    init();
    requestAnimationFrame(draw);
    window.addEventListener('resize', resize);
  })();

  // Particles
  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
  const pContainer = document.getElementById('particles');
  for (let i = 0; i < 24; i++) {
    const s = document.createElement('span');
    s.style.left = Math.random() * 100 + '%';
    s.style.animationDuration = (6 + Math.random() * 10) + 's';
    s.style.animationDelay = (Math.random() * 12) + 's';
    s.style.width = s.style.height = (2 + Math.random() * 4) + 'px';
    pContainer.appendChild(s);
  }
  }
</script>
</body>
</html>
